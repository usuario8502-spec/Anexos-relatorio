    <!-- GERADOR DE MANIFEST DINÂMICO PARA PWA COM ICON.PNG -->
    <script>
        (function() {
            const baseUrl = window.location.href.split('?')[0].replace(/\/[^\/]*$/, '/');
            const manifest = {
                name: "Sistema de Anexos",
                short_name: "Anexos",
                description: "Gestão e Escaneamento de Anexos e Documentos",
                start_url: baseUrl,
                display: "standalone",
                background_color: "#030712",
                theme_color: "#030712",
                orientation: "portrait",
                icons: [
                    { src: baseUrl + "icon.png", sizes: "192x192", type: "image/png", purpose: "any" },
                    { src: baseUrl + "icon.png", sizes: "512x512", type: "image/png", purpose: "any" }
                ]
            };
            const stringManifest = JSON.stringify(manifest);
            const blob = new Blob([stringManifest], {type: 'application/json'});
            const manifestUrl = URL.createObjectURL(blob);
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = manifestUrl;
            document.head.appendChild(link);
        })();
    </script>

        // PROCESSAMENTO DE IMAGEM PARA LETRA CURSIVA
        async function preProcessarImagemParaOCR(imgBase64) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const scale = 2.0; 
                    canvas.width = img.width * scale;
                    canvas.height = img.height * scale;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imageData.data;
                    for (let i = 0; i < data.length; i += 4) {
                        let avg = (data[i] + data[i+1] + data[i+2]) / 3;
                        let val = avg > 150 ? 255 : 0; 
                        data[i] = data[i+1] = data[i+2] = val;
                    }
                    ctx.putImageData(imageData, 0, 0);
                    resolve(canvas.toDataURL('image/jpeg'));
                };
                img.src = imgBase64;
            });
        }

        // FUNÇÃO REFINADA PARA CAPTURAR APENAS NOMES VÁLIDOS
        function padronizarNomePaciente(nomeRaw) {
            if (!nomeRaw) return "Desconhecido";
            let nomeLimpo = nomeRaw.split('\n')[0];
            nomeLimpo = nomeLimpo.replace(/[^a-zA-ZÀ-ÿ\s]/g, '').replace(/\s+/g, ' ').trim();
            // Ignora leituras lixo (curtas demais ou apenas 1 palavra solta)
            if (nomeLimpo.length < 4 || nomeLimpo.split(' ').length < 2) return "Desconhecido";
            return nomeLimpo.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
        }

        // LÓGICA DE IDENTIFICAÇÃO E FATIAMENTO DO PDF COM OCR APRIMORADO
        window.iniciarUploadStorage = async function() {
            const inNome = document.getElementById("nomeArquivoManual");
            let nomeDigitado = inNome ? inNome.value.trim() : "";
            if (!nomeDigitado) return alert("⚠️ Digite um nome para a remessa!");

            const btnSalvar = document.getElementById("btnSalvarUpload");
            const containerProgresso = document.getElementById("containerProgresso");
            const barraProgresso = document.getElementById("barraProgresso");
            
            if (btnSalvar) { btnSalvar.disabled = true; btnSalvar.innerHTML = `<i class="fas fa-spinner animate-spin"></i> Processando...`; }
            if (containerProgresso) containerProgresso.classList.remove("hidden");
            if (barraProgresso) barraProgresso.style.width = '0%';

            if (modoUploadAtual === 'generico' || modoUploadAtual === 'galeria' || modoUploadAtual === 'camera') {
                let concluidos = 0; let totalArquivos = arquivosFilaEnvio.length;
                for (let i = 0; i < totalArquivos; i++) {
                    const file = arquivosFilaEnvio[i];
                    
                    if (file.type === 'application/pdf') {
                        if (btnSalvar) btnSalvar.innerHTML = `<i class="fas fa-spinner animate-spin"></i> Lendo PDF ${i+1}/${totalArquivos}...`;
                        await processarUploadPdfCompleto(file, nomeDigitado, btnSalvar);
                        concluidos++; if (barraProgresso) barraProgresso.style.width = ((concluidos / totalArquivos) * 100) + '%';
                        continue;
                    }

                    if (btnSalvar) btnSalvar.innerHTML = `<i class="fas fa-spinner animate-spin"></i> Enviando ${i+1}/${totalArquivos}...`;
                    let sufixoNome = totalArquivos > 1 ? ` (${i+1})` : "";
                    let nomeParaBanco = nomeDigitado + sufixoNome;
                    let tipoDoBanco = 'arquivo';
                    if (modoUploadAtual === 'camera' || modoUploadAtual === 'galeria') { tipoDoBanco = 'imagem'; } 
                    else { const extMatch = file.name.match(/\.([^.]+)$/); if (extMatch) tipoDoBanco = extMatch[1].toLowerCase(); }

                    await fazerUploadUnico(file, tipoDoBanco, nomeParaBanco, file.type || 'application/octet-stream');
                    concluidos++; if (barraProgresso) barraProgresso.style.width = ((concluidos / totalArquivos) * 100) + '%';
                }
                window.fecharModalUpload(); resetarBotaoAposErro();
            }

            async function processarUploadPdfCompleto(file, nomeBase, btnSalvar) {
                const dataAtual = new Date();
                const pastaData = `${dataAtual.getFullYear()}-${String(dataAtual.getMonth() + 1).padStart(2, '0')}-${String(dataAtual.getDate()).padStart(2, '0')}`;

                // Salva o PDF inteiro de segurança na pasta Relatório Geral
                const refRemessa = storageRef(storage, `Relatorio_Geral/${pastaData}/${Date.now()}_${file.name}`);
                await uploadBytesResumable(refRemessa, file, { contentType: 'application/pdf' });
                const urlGeral = await getDownloadURL(refRemessa);
                await push(dbRef(db, 'arquivos_anexos'), {
                    nome: `${nomeBase || file.name} (Completo)`,
                    url: urlGeral,
                    tipo: 'pdf',
                    enviadoPor: usuarioLogado,
                    dataEnvio: Date.now(),
                    pasta: `Relatorio_Geral/${pastaData}`,
                    statusExclusao: "ativo"
                });

                const arrayBuffer = await file.arrayBuffer();
                const pdfDocLib = await window.PDFLib.PDFDocument.load(arrayBuffer); 
                const pdfDocJs = await window.pdfjsLib.getDocument({data: arrayBuffer}).promise; 

                let pacienteAtual = "Paciente Não Identificado";
                let paginasPorPaciente = {}; 
                const worker = await Tesseract.createWorker('por');

                for (let pageNum = 1; pageNum <= pdfDocJs.numPages; pageNum++) {
                    if (btnSalvar) btnSalvar.innerHTML = `<i class="fas fa-spinner animate-spin"></i> Lendo Pág. ${pageNum}...`;
                    try {
                        const page = await pdfDocJs.getPage(pageNum);
                        const textContent = await page.getTextContent();
                        let texto = textContent.items.map(item => item.str).join(' ');

                        if (!texto.toLowerCase().includes("nome do paciente")) {
                            const viewport = page.getViewport({ scale: 2.0 });
                            const canvas = document.createElement('canvas');
                            const ctx = canvas.getContext('2d');
                            canvas.height = viewport.height;
                            canvas.width = viewport.width;
                            await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                            
                            const imgBw = await preProcessarImagemParaOCR(canvas.toDataURL('image/jpeg'));
                            const ret = await worker.recognize(imgBw);
                            texto = ret.data.text;
                        }
                        
                        // Busca RIGOROSA para evitar separar por rabiscos aleatórios
                        const match = texto.match(/(?:Nome|Noma|Mome)\s+d[oa]\s+paciente\s*[:\-\.]*\s*([^\r\n]+)/i);
                        if (match && match[1]) {
                            let possivelNome = padronizarNomePaciente(match[1]);
                            if (possivelNome !== "Desconhecido") pacienteAtual = possivelNome;
                        }
                    } catch(e) {}

                    if (!paginasPorPaciente[pacienteAtual]) paginasPorPaciente[pacienteAtual] = [];
                    paginasPorPaciente[pacienteAtual].push(pageNum - 1);
                }
                await worker.terminate();

                const nomesPacientes = Object.keys(paginasPorPaciente);
                for (let idx = 0; idx < nomesPacientes.length; idx++) {
                    const nomePac = nomesPacientes[idx];
                    const indices = paginasPorPaciente[nomePac];

                    if (btnSalvar) btnSalvar.innerHTML = `<i class="fas fa-spinner animate-spin"></i> Salvando: ${nomePac}...`;

                    const novoPdf = await window.PDFLib.PDFDocument.create();
                    const paginasCopiadas = await novoPdf.copyPages(pdfDocLib, indices);
                    paginasCopiadas.forEach(p => novoPdf.addPage(p));

                    const pdfBytes = await novoPdf.save();
                    const blobPac = new Blob([pdfBytes], { type: 'application/pdf' });

                    const refPac = storageRef(storage, `Pacientes/${nomePac}/Evolucao_${pastaData}_${Date.now()}.pdf`);
                    await uploadBytesResumable(refPac, blobPac, { contentType: 'application/pdf' });
                    const urlPac = await getDownloadURL(refPac);

                    await push(dbRef(db, 'arquivos_anexos'), {
                        nome: `Evolução - ${nomePac}`,
                        url: urlPac,
                        tipo: 'pdf',
                        enviadoPor: usuarioLogado,
                        dataEnvio: Date.now(),
                        pastaPaciente: nomePac,
                        statusExclusao: "ativo"
                    });
                }
            }

            function fazerUploadUnico(fileObj, tipoDoArquivoBanco, nomeNoBanco, contentTypeReal) {
                return new Promise((resolve) => {
                    const dataAtual = new Date();
                    const pastaData = `${dataAtual.getFullYear()}/${String(dataAtual.getMonth() + 1).padStart(2, '0')}/${String(dataAtual.getDate()).padStart(2, '0')}`;
                    let extensaoParaSalvar = `.${tipoDoArquivoBanco === 'imagem' ? 'jpg' : tipoDoArquivoBanco}`;
                    const extReal = fileObj.name ? (fileObj.name.match(/\.([^.]+)$/) ? `.${fileObj.name.match(/\.([^.]+)$/)[1]}` : extensaoParaSalvar) : extensaoParaSalvar;
                    const nomeUnico = Date.now() + "_" + Math.floor(Math.random()*10000) + extReal;
                    const refCaminho = storageRef(storage, `fotos_anexadas/${pastaData}/${nomeUnico}`);
                    const metadata = { contentType: contentTypeReal };
                    const tarefa = uploadBytesResumable(refCaminho, fileObj, metadata);

                    tarefa.on('state_changed', () => {}, 
                        (erro) => { resolve(); }, 
                        () => {
                            getDownloadURL(tarefa.snapshot.ref).then((url) => {
                                const novoAnexo = { nome: nomeNoBanco, url: url, tipo: tipoDoArquivoBanco, enviadoPor: usuarioLogado, dataEnvio: Date.now(), statusExclusao: "ativo" };
                                push(dbRef(db, 'arquivos_anexos'), novoAnexo).then(() => { resolve(); });
                            });
                        }
                    );
                });
            }

            function resetarBotaoAposErro() {
                if (btnSalvar) { btnSalvar.disabled = false; btnSalvar.innerHTML = `<i class="fas fa-cloud-upload-alt"></i> Salvar e Enviar`; }
                if (containerProgresso) containerProgresso.classList.add("hidden"); 
                if (barraProgresso) barraProgresso.style.width = '0%';
            }
        };

        // ESTRUTURA DE PASTAS E RENDERIZAÇÃO LIMPA E MINIMALISTA
        function carregarGaleriaDeAnexos() {
            onValue(dbRef(db, 'arquivos_anexos'), (snapshot) => {
                todosAnexosNaMemoria = [];
                const selectUsuario = document.getElementById("filtroUsuario");
                let usuariosUnicos = new Set();

                if (snapshot.exists()) {
                    snapshot.forEach(child => { 
                        const anexo = { id: child.key, ...child.val() };
                        if (!anexo.tipo) anexo.tipo = 'imagem'; 
                        todosAnexosNaMemoria.push(anexo);
                        if (anexo.enviadoPor) usuariosUnicos.add(anexo.enviadoPor);
                    });
                    todosAnexosNaMemoria.sort((a, b) => b.dataEnvio - a.dataEnvio);
                }

                if (selectUsuario) {
                    const valorAtualSelect = selectUsuario.value;
                    selectUsuario.innerHTML = '<option value="todos">Todos os Usuários</option>';
                    usuariosUnicos.forEach(user => { selectUsuario.innerHTML += `<option value="${user}">@${user}</option>`; });
                    selectUsuario.value = usuariosUnicos.has(valorAtualSelect) ? valorAtualSelect : "todos";
                }

                window.aplicarFiltrosNaGaleria();
            });
        }

        window.abrirPasta = function(rota) {
            window.pastaAbertaAtual = rota;

        window.voltarParaPastas = function() {
            window.pastaAbertaAtual = null;
            window.aplicarFiltrosNaGaleria();
        };

        window.aplicarFiltrosNaGaleria = function() {
            const inBusca = document.getElementById("inputBuscaAnexo");
            const termoBusca = inBusca ? inBusca.value.toLowerCase().trim() : "";
            const isBuscaAtiva = termoBusca.length > 0;

            const container = document.getElementById("listaAnexos");
            const areaBreadcrumb = document.getElementById("areaBreadcrumb");
            if (!container) return;
            container.innerHTML = "";

            let anexosFiltrados = todosAnexosNaMemoria;
            if (isBuscaAtiva) {
                anexosFiltrados = todosAnexosNaMemoria.filter(arq => 
                    arq.nome.toLowerCase().includes(termoBusca) || 
                    (arq.pastaPaciente && arq.pastaPaciente.toLowerCase().includes(termoBusca))
                );
            }

            const txtInfo = document.getElementById("txtInfoVista");
            const txtCount = document.getElementById("txtContadorArquivos");

            // NIVEL 0: RAIZ - Apenas Relatório Geral e Pacientes
            if (window.pastaAbertaAtual === null && !isBuscaAtiva) {
                if (areaBreadcrumb) areaBreadcrumb.innerHTML = `<span class="text-gray-300 font-bold">Pastas do Sistema</span>`;
                if (txtInfo) txtInfo.innerText = "Navegando nas Pastas";

                const arqsGeral = anexosFiltrados.filter(a => a.pasta && a.pasta.startsWith("Relatorio_Geral"));
                const arqsPacientes = anexosFiltrados.filter(a => a.pastaPaciente);

                renderizarCardPasta(container, "Relatório Geral", `${arqsGeral.length} itens salvos`, "window.abrirPasta('relatorio_geral')", false);
                renderizarCardPasta(container, "Pacientes", `${arqsPacientes.length} evoluções`, "window.abrirPasta('pacientes_root')", true);

                if (txtCount) txtCount.innerText = `2 pastas`;

            } 
            // NIVEL 1: DENTRO DE PACIENTES - Subpastas por Nomes Limpos
            else if (window.pastaAbertaAtual === 'pacientes_root' && !isBuscaAtiva) {
                if (areaBreadcrumb) areaBreadcrumb.innerHTML = `<button onclick="window.voltarParaPastas()" class="text-gray-400 hover:text-white transition flex items-center gap-2"><i class="fas fa-arrow-left"></i> Voltar</button><span class="text-gray-600 mx-2">/</span><span class="text-gray-300 font-bold">Pacientes</span>`;
                if (txtInfo) txtInfo.innerText = "Selecione o Paciente";
                
                const agrupamentoPacientes = {};
                anexosFiltrados.forEach(arq => {
                    if (arq.pastaPaciente) {
                        if(!agrupamentoPacientes[arq.pastaPaciente]) agrupamentoPacientes[arq.pastaPaciente] = [];
                        agrupamentoPacientes[arq.pastaPaciente].push(arq);
                    }
                });

                const pacientesNomes = Object.keys(agrupamentoPacientes).sort();
                if(pacientesNomes.length === 0) container.innerHTML = `<div class="col-span-full text-center text-gray-500 py-4 text-sm">Nenhum paciente ainda.</div>`;

                pacientesNomes.forEach(nome => {
                    const qtd = agrupamentoPacientes[nome].length;
                    renderizarCardPasta(container, nome, `${qtd} evoluções`, `window.abrirPasta('paciente:${nome}')`, true);
                });
                if (txtCount) txtCount.innerText = `${pacientesNomes.length} pacientes`;
            }
            // NIVEL 1: DENTRO DO RELATÓRIO GERAL
            else if (window.pastaAbertaAtual === 'relatorio_geral' && !isBuscaAtiva) {
                if (areaBreadcrumb) areaBreadcrumb.innerHTML = `<button onclick="window.voltarParaPastas()" class="text-gray-400 hover:text-white transition flex items-center gap-2"><i class="fas fa-arrow-left"></i> Voltar</button><span class="text-gray-600 mx-2">/</span><span class="text-gray-300 font-bold">Relatório Geral</span>`;
                if (txtInfo) txtInfo.innerText = "Arquivos Gerais";
                
                const arqs = anexosFiltrados.filter(a => a.pasta && a.pasta.startsWith("Relatorio_Geral"));
                renderizarArquivosFinais(arqs, container);
                if (txtCount) txtCount.innerText = `${arqs.length} relatórios`;
            }
            // NIVEL 2: DENTRO DO NOME DO PACIENTE
            else if (window.pastaAbertaAtual && window.pastaAbertaAtual.startsWith('paciente:') && !isBuscaAtiva) {
                const nomePac = window.pastaAbertaAtual.split('paciente:')[1];
                if (areaBreadcrumb) areaBreadcrumb.innerHTML = `<button onclick="window.abrirPasta('pacientes_root')" class="text-gray-400 hover:text-white transition flex items-center gap-2"><i class="fas fa-arrow-left"></i> Voltar</button><span class="text-gray-600 mx-2">/</span><span class="text-gray-300 font-bold truncate max-w-[150px]">${nomePac}</span>`;
                if (txtInfo) txtInfo.innerText = "Evoluções do Paciente";

                const arqs = anexosFiltrados.filter(a => a.pastaPaciente === nomePac);
                renderizarArquivosFinais(arqs, container);
                if (txtCount) txtCount.innerText = `${arqs.length} evoluções`;
            }
            // BUSCA GLOBAL
            else {
                if (areaBreadcrumb) areaBreadcrumb.innerHTML = `<button onclick="document.getElementById('inputBuscaAnexo').value=''; window.aplicarFiltrosNaGaleria();" class="text-gray-400 hover:text-white transition flex items-center gap-2"><i class="fas fa-arrow-left"></i> Limpar</button><span class="text-gray-600 mx-2">/</span><span class="text-blue-400 font-bold">Resultados</span>`;
                if (txtInfo) txtInfo.innerText = "Resultados da Pesquisa";
                renderizarArquivosFinais(anexosFiltrados, container);
                if (txtCount) txtCount.innerText = `${anexosFiltrados.length} encontrados`;
            }
        };

        // FUNÇÃO DE RENDERIZAR PASTA COM LAYOUT DE BLOCOS MENORES SEM EMOJIS

                const dataStr = dataObj.toLocaleDateString('pt-BR');
                const horaStr = dataObj.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
                const nomeSeguro = arq.nome.replace(/'/g, "\\'").replace(/"/g, "&quot;");

                card.setAttribute("onclick", `window.abrirModalVisualizacao('${arq.id}', '${arq.url}', '${nomeSeguro}', '${arq.tipo}')`);
                card.innerHTML = `${icone}<div class="flex-1 min-w-0"><h4 class="font-bold text-white text-[11px] truncate uppercase">${arq.nome}</h4><p class="text-[9px] text-gray-500 mt-1"><i class="far fa-clock"></i> ${dataStr}</p></div>`;
                container.appendChild(card);

        // COMPARTILHAMENTO NATIVO WEB SHARE API
        window.abrirModalVisualizacao = function(id, url, nome, tipo) {
            window.idImagemAtiva = id; window.urlImagemAtiva = url; window.tipoAnexoAtivo = tipo || 'imagem';
            const tCard = document.getElementById("tituloImagemCard"); if (tCard) tCard.innerText = nome;
            const inEd = document.getElementById("inputEdicaoNome"); if (inEd) inEd.value = nome;
            const tp = window.tipoAnexoAtivo.toLowerCase();
            
            const elImagem = document.getElementById("imagemEmDestaque"); 
            const elIframe = document.getElementById("iframePreview");
            
            if (elImagem) elImagem.classList.add("hidden"); 
            if (elIframe) elIframe.classList.add("hidden");
            
            if (['jpg', 'jpeg', 'png', 'imagem'].includes(tp)) { 
                if (elImagem) { elImagem.src = url; elImagem.classList.remove("hidden"); }
            } else {
                if (elIframe) { elIframe.src = `https://docs.google.com/gview?url=${encodeURIComponent(url)}&embedded=true`; elIframe.classList.remove("hidden"); }
            }
            
            const modal = document.getElementById("modalVisualizacao"); const content = document.getElementById("modalVisualizacaoContent");
            if (modal && content) {
                modal.classList.remove("hidden"); modal.classList.add("flex");
                setTimeout(() => { content.classList.remove("scale-95", "opacity-0"); content.classList.add("scale-100", "opacity-100"); }, 10);
            }
        };

        window.fecharModalVisualizacao = function() {
            const modal = document.getElementById("modalVisualizacao"); const content = document.getElementById("modalVisualizacaoContent");
            if (modal && content) {
                content.classList.remove("scale-100", "opacity-100"); content.classList.add("scale-95", "opacity-0");
                setTimeout(() => { modal.classList.remove("flex"); modal.classList.add("hidden"); }, 200);
            }
        };

        window.compartilharAnexoAtivo = async function() {
            const tCard = document.getElementById("tituloImagemCard");
            let nomeLimpo = tCard ? tCard.innerText : "Documento do Sistema";
            
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: nomeLimpo,
                        text: `Confira este documento: ${nomeLimpo}`,
                        url: window.urlImagemAtiva
                    });
                } catch (err) {}
            } else {
                navigator.clipboard.writeText(window.urlImagemAtiva).then(() => {
                    alert("🔗 Link copiado para a área de transferência!");
                });
            }
        };

        window.baixarAnexoAtivo = async function() {
            const btnBaixar = document.getElementById("btnBaixarAnexo"); 
            const htmlOriginal = btnBaixar ? btnBaixar.innerHTML : "";
            if (btnBaixar) btnBaixar.innerHTML = `<i class="fas fa-spinner animate-spin"></i> Preparando...`;
            try {
                const resposta = await fetch(window.urlImagemAtiva); const blob = await resposta.blob(); const urlBlob = window.URL.createObjectURL(blob);
                const a = document.createElement('a'); a.style.display = 'none'; a.href = urlBlob;
                const tp = window.tipoAnexoAtivo.toLowerCase(); let extensao = `.${tp}`; if (tp === 'imagem') extensao = '.jpg';
                const tCard = document.getElementById("tituloImagemCard");
                let nomeLimpo = tCard ? tCard.innerText.replace(/[^a-zA-Z0-9.\- ()]/g, "") : "arquivo"; a.download = nomeLimpo + extensao;
                document.body.appendChild(a); a.click();
                setTimeout(() => { if (document.body.contains(a)) document.body.removeChild(a); window.URL.revokeObjectURL(urlBlob); }, 2000);
            } catch (erro) { window.open(window.urlImagemAtiva, "_blank"); }
            if (btnBaixar) btnBaixar.innerHTML = htmlOriginal;
        };

        window.executarExclusaoDisfarçada = function() {
            if (!confirm(`⚠️ Deseja excluir este anexo?`)) return;
            remove(dbRef(db, 'arquivos_anexos/' + window.idImagemAtiva)).then(() => { window.fecharModalVisualizacao(); });
        };

        window.abrirEdicaoNome = function() {
            const tCard = document.getElementById("tituloImagemCard"); if (tCard) tCard.classList.add("hidden");
            const aEd = document.getElementById("areaEdicaoNome"); if (aEd) { aEd.classList.remove("hidden"); aEd.classList.add("flex"); }
        };

        window.cancelarEdicaoNome = function() {
            const aEd = document.getElementById("areaEdicaoNome"); if (aEd) { aEd.classList.add("hidden"); aEd.classList.remove("flex"); }
            const tCard = document.getElementById("tituloImagemCard"); if (tCard) tCard.classList.remove("hidden");
        };

        window.salvarNovoNome = function() {
            const inEd = document.getElementById("inputEdicaoNome");
            const novoNome = inEd ? inEd.value.trim() : "";
            if (!novoNome) return alert("⚠️ Digite um nome válido!");
            update(dbRef(db, 'arquivos_anexos/' + window.idImagemAtiva), { nome: novoNome }).then(() => { 
                const tCard = document.getElementById("tituloImagemCard"); if (tCard) tCard.innerText = novoNome; 
                window.cancelarEdicaoNome(); 
            });
        };

        window.abrirModalNotificacoes = function() { 
            const modal = document.getElementById("modalNotificacoes"); const content = document.getElementById("modalNotificacoesContent"); 
            if (modal && content) { modal.classList.remove("hidden"); modal.classList.add("flex"); setTimeout(() => { content.classList.remove("scale-95", "opacity-0"); content.classList.add("scale-100", "opacity-100"); }, 10); }
        };

        window.fecharModalNotificacoes = function() { 
            const modal = document.getElementById("modalNotificacoes"); const content = document.getElementById("modalNotificacoesContent"); 
            if (modal && content) { content.classList.remove("scale-100", "opacity-100"); content.classList.add("scale-95", "opacity-0"); setTimeout(() => { modal.classList.remove("flex"); modal.classList.add("hidden"); }, 200); }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                uidUsuarioLogado = user.uid;
                const fallbackUsername = user.email.split('@')[0];

                onValue(dbRef(db, 'usuarios_sistema/' + user.uid), (snap) => {
                    let dadosUser = null;
                    if (snap.exists()) {
                        dadosUser = snap.val();
                        usuarioLogado = dadosUser.username || fallbackUsername;
                        perfilUsuario = dadosUser.perfil || "operador";
                    } else {
                        usuarioLogado = fallbackUsername;
                        perfilUsuario = "administrador";
                        dadosUser = { username: usuarioLogado, perfil: "administrador" };
                    }

                    const elSidebarNome = document.getElementById("sidebarNomeUsuario");
                    const elSidebarPerfil = document.getElementById("sidebarPerfilUsuario");
                    if (elSidebarNome) elSidebarNome.innerText = `@${usuarioLogado}`;
                    if (elSidebarPerfil) elSidebarPerfil.innerText = perfilUsuario;

                    const areaSino = document.getElementById("areaSinoAdmin");
                    const espacador = document.getElementById("espacadorHeader");
                    
                    if (perfilUsuario === "administrador") {
                        if (areaSino) areaSino.classList.remove("hidden");
                        if (espacador) espacador.classList.add("hidden");
                        if (typeof window.inicializarNotificacoes === 'function') {
                            window.inicializarNotificacoes(dadosUser, "containerNotificacoes", "badgeNotificacoes");
                        }
                    } else {
                        if (areaSino) areaSino.classList.add("hidden");
                        if (espacador) espacador.classList.remove("hidden");
                    }
                    carregarGaleriaDeAnexos();
                });
            } else {
                const elSidebarNome = document.getElementById("sidebarNomeUsuario");
                const elSidebarPerfil = document.getElementById("sidebarPerfilUsuario");
                if (elSidebarNome) elSidebarNome.innerText = "@VisitanteCodePen";
                if (elSidebarPerfil) elSidebarPerfil.innerText = "Operador";
            }
        });

        escutarEventoSeguro("inputBuscaAnexo", "input", window.aplicarFiltrosNaGaleria);
        escutarEventoSeguro("dataInicioFiltro", "change", window.aplicarFiltrosNaGaleria);
        escutarEventoSeguro("dataFimFiltro", "change", window.aplicarFiltrosNaGaleria);
        escutarEventoSeguro("filtroUsuario", "change", window.aplicarFiltrosNaGaleria);
    </script>
</body>
</html>
